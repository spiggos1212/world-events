<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Events</title>
  <meta name="description" content="Η ιστορία του κόσμου από το 3000 π.Χ. έως σήμερα, πάνω σε έναν διαδραστικό χάρτη με timeline." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="brand">
    <h1>World Events</h1>
    <p class="sub">Η ιστορία του κόσμου, 3000 π.Χ. – σήμερα</p>
  </header>

  <main id="map-wrap" aria-label="World map">
    <svg id="map" role="img" aria-label="Παγκόσμιος χάρτης">
      <defs>
        <radialGradient id="ocean-grad" cx="50%" cy="45%" r="70%">
          <stop offset="0%" stop-color="#17305c" />
          <stop offset="60%" stop-color="#0d1b3a" />
          <stop offset="100%" stop-color="#070d1f" />
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="label-shadow" x="-10%" y="-30%" width="120%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6" />
        </filter>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
        </marker>
      </defs>
    </svg>

    <aside id="sidebar" class="sidebar" aria-label="Φίλτρα">
      <div class="sb-head">
        <span class="sb-title">Φίλτρα</span>
        <button id="sidebar-close" class="panel-toggle" aria-label="Απόκρυψη φίλτρων" title="Απόκρυψη">‹</button>
      </div>
      <div class="sb-body">
        <section class="sb-sec">
          <h3 class="sb-sec-title">Χάρτης</h3>
          <label class="sb-row sb-switch" title="Τα σύνορα αλλάζουν ανάλογα με την εποχή. Απενεργοποίησέ το για τα σημερινά σύνορα.">
            <input id="hist-toggle" type="checkbox" checked />
            <span class="sw"></span>
            <span class="txt">🗺 Ιστορικά σύνορα</span>
          </label>
          <span id="hist-loading" class="hist-loading">Φόρτωση συνόρων…</span>
        </section>
        <section class="sb-sec">
          <h3 class="sb-sec-title">Γεγονότα
            <span class="sb-actions">
              <button id="filters-all" class="sb-link">Όλα</button>
              <button id="filters-none" class="sb-link">Κανένα</button>
            </span>
          </h3>
          <div id="filters" class="filters" aria-label="Φίλτρα γεγονότων"></div>
        </section>
        <p class="sb-credit">Σύνορα: <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">historical-basemaps</a> (GPL-3.0, κατά προσέγγιση)</p>
      </div>
    </aside>
    <button id="sidebar-open" class="sidebar-open-btn" aria-label="Εμφάνιση φίλτρων">☰ Φίλτρα</button>

    <aside id="panel" class="panel" aria-label="Γεγονότα σε εξέλιξη">
      <div class="panel-head">
        <span class="panel-title">Συμβαίνει τώρα</span>
        <span id="panel-count" class="panel-count">0</span>
        <button id="panel-toggle" class="panel-toggle" aria-label="Απόκρυψη πάνελ" title="Απόκρυψη/εμφάνιση">›</button>
      </div>
      <ul id="panel-list" class="panel-list"></ul>
    </aside>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
    <div id="loading" class="loading">Φόρτωση χάρτη…</div>
  </main>

  <footer class="timeline" aria-label="Timeline">
    <div class="tl-left">
      <button id="play" class="play-btn" aria-label="Play" title="Play / Pause (Space)">
        <svg class="ico-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <button id="step-back" class="icon-btn small" title="−1 έτος" aria-label="Previous year">‹</button>
      <button id="step-fwd" class="icon-btn small" title="+1 έτος" aria-label="Next year">›</button>
    </div>

    <div class="tl-center">
      <div class="year-display">
        <span id="year" class="year">3000 π.Χ.</span>
        <span id="month" class="month"></span>
        <span id="era" class="era"></span>
      </div>
      <div class="track-wrap">
        <div id="ticks" class="ticks" aria-hidden="true"></div>
        <div id="event-marks" class="event-marks" aria-hidden="true"></div>
        <input id="track" class="track" type="range" min="0" max="1" step="1" value="0"
               aria-label="Θέση στο timeline" />
        <div class="range-labels" aria-hidden="true">
          <span id="label-start"></span>
          <span id="label-end"></span>
        </div>
      </div>
    </div>

    <div class="tl-right">
      <label class="speed-label" for="speed-input">Έτη / δευτ.</label>
      <div id="speed" class="speed" role="group" aria-label="Ταχύτητα αναπαραγωγής (έτη ανά δευτερόλεπτο)">
        <button data-speed="0.5" title="0.5 έτη ανά δευτερόλεπτο">0.5</button>
        <button data-speed="1" class="active" title="1 έτος ανά δευτερόλεπτο">1</button>
        <button data-speed="5" title="5 έτη ανά δευτερόλεπτο">5</button>
        <button data-speed="10" title="10 έτη ανά δευτερόλεπτο">10</button>
        <input id="speed-input" class="speed-input" type="number" inputmode="decimal" min="0.1" max="1000" step="0.1" value="1"
               aria-label="Έτη ανά δευτερόλεπτο" title="Γράψε πόσα έτη ανά δευτερόλεπτο θέλεις" />
      </div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="events.js"></script>
  <script src="plants.js"></script>
  <script src="animals.js"></script>
  <script src="religions.js"></script>
  <script src="app.js"></script>
</body>
</html>
