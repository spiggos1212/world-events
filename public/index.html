<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b3a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>World Events</title>
  <meta name="description" content="Η ιστορία του κόσμου από το 3000 π.Χ. έως σήμερα, πάνω σε έναν διαδραστικό χάρτη με timeline." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="brand">
    <h1>World Events</h1>
    <p class="sub" data-i18n="subtitle">Η ιστορία του κόσμου, 3000 π.Χ. – σήμερα</p>
  </header>

  <main id="map-wrap" aria-label="World map">
    <svg id="map" role="img" aria-label="Παγκόσμιος χάρτης">
      <defs>
        <radialGradient id="ocean-grad" cx="50%" cy="45%" r="70%">
          <stop offset="0%" stop-color="#17305c" />
          <stop offset="60%" stop-color="#0d1b3a" />
          <stop offset="100%" stop-color="#070d1f" />
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="label-shadow" x="-10%" y="-30%" width="120%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6" />
        </filter>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
        </marker>
      </defs>
    </svg>

    <aside id="sidebar" class="sidebar" aria-label="Φίλτρα">
      <div class="sb-head">
        <span class="sb-title" data-i18n="filters">Φίλτρα</span>
        <div id="lang" class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="el" title="Ελληνικά">EL</button>
          <button type="button" data-lang="en" title="English">EN</button>
        </div>
        <button id="sidebar-close" class="panel-toggle" aria-label="Απόκρυψη φίλτρων" data-i18n-aria="hideFilters" title="Απόκρυψη" data-i18n-title="hide">‹</button>
      </div>
      <div class="sb-body">
        <section class="sb-sec sb-search">
          <input id="search" class="search" type="search" placeholder="Αναζήτηση: γεγονός, φυτό, ζώο, θρησκεία…" data-i18n-ph="searchPh"
                 autocomplete="off" spellcheck="false" aria-label="Αναζήτηση" data-i18n-aria="search" />
          <div id="search-meta" class="search-meta"></div>
          <ul id="search-results" class="search-results" role="listbox"></ul>
        </section>
        <section class="sb-sec sb-map">
          <h3 class="sb-sec-title"><span data-i18n="map">Χάρτης</span></h3>
          <div class="seg-row">
            <span class="seg-label" data-i18n="projection">Προβολή</span>
            <div id="proj" class="seg" role="group" aria-label="Προβολή χάρτη">
              <button data-proj="flat" data-i18n="projFlat">Επίπεδος</button>
              <button data-proj="globe" data-i18n="projGlobe">Υδρόγειος</button>
            </div>
          </div>
        </section>
        <section class="sb-sec">
          <h3 class="sb-sec-title"><span data-i18n="events">Γεγονότα</span>
            <span class="sb-actions">
              <button id="filters-all" class="sb-link" data-i18n="all">Όλα</button>
              <button id="filters-none" class="sb-link" data-i18n="none">Κανένα</button>
            </span>
          </h3>
          <div id="filters" class="filters" aria-label="Φίλτρα γεγονότων"></div>
        </section>
        <p class="sb-credit"><span data-i18n="borders">Σύνορα:</span> <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">historical-basemaps</a> <span data-i18n="creditNote">(GPL-3.0, κατά προσέγγιση)</span></p>
      </div>
    </aside>
    <button id="sidebar-open" class="sidebar-open-btn" aria-label="Εμφάνιση φίλτρων" data-i18n-aria="showFilters"><span class="ico">☰</span><span class="full" data-i18n="filters">Φίλτρα</span></button>
    <button id="search-open" class="search-open-btn" aria-label="Αναζήτηση" data-i18n-aria="search"><span class="ico">🔍</span><span class="full" data-i18n="search">Αναζήτηση</span></button>
    <div class="map-opts">
      <button id="featured-only" class="big-toggle on" type="button" aria-pressed="true"><span class="star">★</span> <span class="txt-long" data-i18n="featuredOnly">Μόνο τα μεγαλύτερα γεγονότα</span><span class="txt-short" data-i18n="featuredOnlyShort">Μεγαλύτερα</span></button>
      <select id="region" class="big-select" aria-label="Ήπειρος" data-i18n-aria="region"></select>
    </div>
    <span id="hist-loading" class="hist-loading" data-i18n="loadingBorders">Φόρτωση συνόρων…</span>

    <aside id="panel" class="panel" aria-label="Γεγονότα σε εξέλιξη">
      <div class="panel-head">
        <span class="panel-title" data-i18n="now">Συμβαίνει τώρα</span>
        <span id="panel-count" class="panel-count">0</span>
        <button id="panel-toggle" class="panel-toggle" aria-label="Απόκρυψη πάνελ" data-i18n-aria="hidePanel" title="Απόκρυψη" data-i18n-title="hide">›</button>
      </div>
      <ul id="panel-list" class="panel-list"></ul>
    </aside>

    <div id="postcard" class="postcard collapsed" aria-hidden="true">
      <img id="postcard-img" alt="" />
      <div id="postcard-cap" class="postcard-cap"></div>
    </div>

    <aside id="story" class="story collapsed" aria-label="Ιστορία γεγονότος" data-i18n-aria="storyAria">
      <div class="story-head">
        <span id="story-type" class="story-type"></span>
        <button id="story-close" class="panel-toggle" aria-label="Κλείσιμο" data-i18n-aria="close" title="Κλείσιμο" data-i18n-title="close">×</button>
      </div>
      <div id="story-body" class="story-body">
        <div id="story-media" class="story-media"></div>
        <div class="story-text">
          <h2 id="story-title" class="story-title"></h2>
          <div id="story-meta" class="story-meta"></div>
          <p id="story-desc" class="story-desc"></p>
          <div id="story-feature" class="story-feature"></div>
          <div id="story-wiki" class="story-wiki"></div>
          <div id="story-links" class="story-links"></div>
        </div>
      </div>
    </aside>

    <!-- Μεγάλη εισαγωγή όταν εμφανίζεται ένα κορυφαίο γεγονός -->
    <div id="intro" class="intro collapsed" aria-hidden="true">
      <div class="intro-flash"></div>
      <div class="intro-card">
        <span id="intro-year" class="intro-year"></span>
        <span id="intro-title" class="intro-title"></span>
      </div>
    </div>
    <!-- Σινεμά: μεγάλο popup με βίντεο / φωτογραφία του κορυφαίου γεγονότος -->
    <div id="cinema" class="cinema collapsed" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="cinema-title">
      <div id="cinema-backdrop" class="cinema-backdrop"></div>
      <div class="cinema-box">
        <div class="cinema-head">
          <span id="cinema-type" class="cinema-type"></span>
          <span id="cinema-meta" class="cinema-meta"></span>
          <button id="cinema-close" class="panel-toggle" aria-label="Κλείσιμο" data-i18n-aria="close" title="Κλείσιμο" data-i18n-title="close">×</button>
        </div>
        <h2 id="cinema-title" class="cinema-title"></h2>
        <div id="cinema-media" class="cinema-media"></div>
        <div class="cinema-foot">
          <p id="cinema-cap" class="cinema-cap"></p>
          <div id="cinema-credit" class="cinema-credit"></div>
          <div class="cinema-actions">
            <button id="cinema-more" type="button" data-i18n="cinemaMore">Όλη η ιστορία</button>
            <button id="cinema-continue" type="button" class="primary" data-i18n="cinemaContinue">Συνέχεια ▶</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
    <div id="loading" class="loading" data-i18n="loadingMap">Φόρτωση χάρτη…</div>
  </main>

  <footer class="timeline" aria-label="Timeline">
    <div class="tl-left">
      <button id="play" class="play-btn" aria-label="Play" title="Play / Pause (Space)">
        <svg class="ico-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <span class="speed-label" data-i18n="speedLabel" title="Ταχύτητα αναπαραγωγής" data-i18n-title="speedTitle">1 έτος / δευτ.</span>
    </div>

    <div class="tl-center">
      <div class="year-display">
        <span id="year" class="year">3000 π.Χ.</span>
        <span id="month" class="month"></span>
        <span id="era" class="era"></span>
      </div>
      <div class="track-wrap">
        <div id="ticks" class="ticks" aria-hidden="true"></div>
        <div id="event-marks" class="event-marks" aria-hidden="true"></div>
        <input id="track" class="track" type="range" min="0" max="1" step="1" value="0"
               aria-label="Θέση στο timeline" data-i18n-aria="trackAria" />
        <div class="range-labels" aria-hidden="true">
          <span id="label-start"></span>
          <span id="label-end"></span>
        </div>
      </div>
    </div>

    <div class="tl-right">
      <button id="step-back" class="nav-btn" title="Προηγούμενο γεγονός" data-i18n-title="prevYear" aria-label="Previous event">‹ <span class="txt-long" data-i18n="prevEvent">Προηγούμενο γεγονός</span><span class="txt-short" data-i18n="prevEventShort">Προηγ.</span></button>
      <button id="step-fwd" class="nav-btn" title="Επόμενο γεγονός" data-i18n-title="nextYear" aria-label="Next event"><span class="txt-long" data-i18n="nextEvent">Επόμενο γεγονός</span><span class="txt-short" data-i18n="nextEventShort">Επόμ.</span> ›</button>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="continents.js"></script>
  <script src="events.js"></script>
  <script src="plants.js"></script>
  <script src="animals.js"></script>
  <script src="religions.js"></script>
  <script src="americas.js"></script>
  <script src="regions.js"></script>
  <script src="regional.js"></script>
  <script src="en/events.js"></script>
  <script src="en/plants.js"></script>
  <script src="en/animals.js"></script>
  <script src="en/religions.js"></script>
  <script src="en/americas.js"></script>
  <script src="en/regions.js"></script>
  <script src="en/regional.js"></script>
  <script src="wiki.js"></script>
  <script src="featured.js"></script>
  <script src="app.js"></script>
</body>
</html>
